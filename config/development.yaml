input_directory: "input"
output_directory: "output"
log_level: "DEBUG"
enable_async: false

processing:
  max_workers: 2
  chunk_size: 500
  timeout_seconds: 60
  retry_attempts: 2
  enable_validation: true
  enable_balance_checking: true
  duplicate_prefix: "DUPLICATED" # Customize duplicate transaction prefix (e.g. "DUPLICADO", "DUPLICATE")

output:
  default_format: "excel"
  excel_sheet_name: "Transactions"
  include_index: false
  date_format: "%Y-%m-%d"
  decimal_separator: "."

# Payment method display name customization
# Uncomment and modify to customize payment method names in reports
payment_method_mapping:
# MACRO_VISA: "MACRO VISA" # Override default "Macro Visa"
# BBVA_VISA: "BBVA VISA" # Override default "BBVA Visa"
# MERCADOPAGO: "mercadopago" # Override default "Mercado Pago"
# BBVA_MASTERCARD: "BBVA Mastercard" # Commented = use default
# BBVA_ACCOUNT: "BBVA Account"       # Commented = use default
# MACRO_ACCOUNT: "Macro Account"     # Commented = use default

# Amount sign inversion configuration
# Invert the sign of transaction amounts for specific payment methods
# Useful for credit cards where charges should appear as negative
amount_sign_inversion:
  invert_all: false # Set to true to invert all payment methods
  invert_patterns: # [] # Patterns to invert (fnmatch-style wildcards)
    - "*_VISA" # All VISA cards
    - "*_MASTERCARD" # All Mastercard cards
  exclude_patterns: [] # Patterns to exclude from inversion (highest priority)
  # - "*_ACCOUNT"    # Exclude all account types
