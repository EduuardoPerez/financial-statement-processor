repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --ignore=E501]
      - id: ruff-format # Auto-format code

  - repo: local
    hooks:
      - id: mypy
        name: mypy type checking
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
