repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix, --ignore=E501] # Auto-fix issues, ignore line length for now
      - id: ruff-format # Auto-format code

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [pandas-stubs>=2.1.0, types-openpyxl>=3.1.0]

  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest with coverage check
        entry: uv run pytest --cov=. --cov-report=term-missing --cov-fail-under=90 --cov-config=.coveragerc
        language: system
        pass_filenames: false
        always_run: true
