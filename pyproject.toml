[project]
name = "financial-statement-processor"
version = "0.1.0"
description = "A Python tool for processing financial statements from various banks into structured Excel format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pdfplumber>=0.11.6",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
]

[tool.flake8]
max-line-length = 88
per-file-ignores = [
    "tests/*:E501",  # Ignore line length in test files
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:openpyxl.styles.stylesheet",
]
